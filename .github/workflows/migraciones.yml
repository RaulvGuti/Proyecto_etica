name: Migraciones

# Valida las migraciones de Supabase en el PR y las aplica o verifica.
#
# La guarda de inmutabilidad es la pieza clave: una migracion que ya se aplico
# en un entorno NO se edita nunca. Editarla hace que el historial local y el remoto
# diverjan, causando conflictos graves en despliegue.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: migraciones-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SUPABASE_CLI: "2.117.0"

jobs:
  inmutabilidad:
    name: Migraciones no editadas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Comprobar que no se edito una migracion existente
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"

          # Solo importan las modificadas o borradas. Las nuevas (A) son legitimas.
          tocadas="$(git diff --name-only --diff-filter=MD "$base" HEAD -- 'supabase/migrations/')"

          if [ -n "$tocadas" ]; then
            # Valvula de escape para los casos legitimos (una migracion que aun no se
            # aplico en produccion). Deja rastro visible en el PR.
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'migracion-editada-a-proposito') }}" = "true" ]; then
              echo "::warning::Se edito una migracion existente, permitido por etiqueta."
            else
              echo "::error::Se modificaron o borraron migraciones ya existentes:"
              echo "$tocadas"
              echo "Una migracion aplicada no se edita: crea una nueva migracion numerada que corrija."
              exit 1
            fi
          fi

      - name: Validar la numeracion y formato
        run: |
          # Formato NNNNN_descripcion.sql, sin duplicados de numero.
          malos="$(find supabase/migrations -name '*.sql' -printf '%f\n' \
                   | grep -vE '^[0-9]{5}_[a-z0-9_]+\.sql$' || true)"
          [ -z "$malos" ] || { echo "::error::Nombres invalidos:"; echo "$malos"; exit 1; }

          dups="$(find supabase/migrations -name '*.sql' -printf '%f\n' \
                  | cut -c1-5 | sort | uniq -d)"
          [ -z "$dups" ] || { echo "::error::Numeros duplicados: $dups"; exit 1; }
          echo "Numeracion de migraciones valida y sin duplicados."

  validar:
    name: Validar contra Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@f72d5b6d36e6b83f0f2cf78b27376c9f6974720e # v1.8.0
        with:
          version: ${{ env.SUPABASE_CLI }}

      # Se excluyen los servicios innecesarios para validar: arranca mas rapido.
      - name: Iniciar servicios minimos de Supabase
        run: supabase start -x studio,mailpit,imgproxy,realtime,storage-api

      - name: Reiniciar y ejecutar migraciones y seed
        run: supabase db reset

      - name: Lint de esquema de base de datos
        run: supabase db lint

      - name: Detener Supabase
        if: always()
        run: supabase stop
